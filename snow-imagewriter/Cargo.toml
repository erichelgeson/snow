[package]
name = "snow_imagewriter"
version = "1.2.0"
edition = "2024"
description = "Apple ImageWriter II printer emulation for Snow"
license = "MIT"

[[bin]]
name = "snow-imagewriter"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
image = "0.25"
printpdf = "0.7"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
ctrlc = "3"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["fs", "term"] }
libc = "0.2"

[lints]
workspace = true
